# Self-hosted stack. Only the web app is published, and only on 127.0.0.1:
# mysql, redis, api and scheduler are reachable on the compose network only.
# For local development with `go run` / `npm run dev`, see docker-compose.dev.yml.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      # Always talk to the services above, whatever .env says.
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.scheduler
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ASSET_BOT_USERNAME: ${VITE_ASSET_BOT_USERNAME:-}
        VITE_SENTINEL_BOT_USERNAME: ${VITE_SENTINEL_BOT_USERNAME:-}
    ports:
      - "127.0.0.1:${WT_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
